name: Telegram lavhalarini yangilash

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kanaldan lavhalarni o'qish
        run: python scripts/sync_telegram.py
      - name: O'zgarishni saqlash
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Telegram lavhalari yangilandi"
            git push
          else
            echo "o'zgarish yo'q"
          fi
